apiVersion: apps/v1
kind: Deployment
metadata:
  name: ofertonazos
  labels:
    app: ofertonazos
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ofertonazos
  template:
    metadata:
      labels:
        app: ofertonazos
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/api/metrics"
    spec:
      containers:
        - name: ofertonazos
          # Replace YOUR_DOCKERHUB_USERNAME with your Docker Hub username
          image: cookstolo/ofertonazos:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: ofertonazos-config
            - secretRef:
                name: ofertonazos-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
