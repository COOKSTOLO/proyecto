apiVersion: apps/v1
kind: Deployment
metadata:
  name: ofertonazos
  labels:
    app: ofertonazos
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ofertonazos
  template:
    metadata:
      labels:
        app: ofertonazos
    spec:
      containers:
        - name: ofertonazos
          # Replace YOUR_DOCKERHUB_USERNAME with your Docker Hub username
          image: cookstolo/ofertonazos:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: ofertonazos-config
            - secretRef:
                name: ofertonazos-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
