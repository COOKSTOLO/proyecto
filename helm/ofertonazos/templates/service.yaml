apiVersion: v1
kind: Service
metadata:
  name: {{ include "ofertonazos.fullname" . }}
  labels:
    {{- include "ofertonazos.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "ofertonazos.selectorLabels" . | nindent 4 }}
  ports:
    - protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      name: http
