apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      scrape_timeout: 10s

    rule_files:
      - /etc/prometheus/rules/*.yml

    alerting:
      alertmanagers:
        - static_configs:
            - targets: []

    scrape_configs:
      # ── Prometheus itself ────────────────────────────────────────────────────
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]

      # ── Kubernetes API server ────────────────────────────────────────────────
      - job_name: kubernetes-apiservers
        kubernetes_sd_configs:
          - role: endpoints
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - source_labels:
              [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
            action: keep
            regex: default;kubernetes;https

      # ── Kubernetes nodes (kubelet) ───────────────────────────────────────────
      - job_name: kubernetes-nodes
        kubernetes_sd_configs:
          - role: node
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)

      # ── cAdvisor (container metrics) ────────────────────────────────────────
      - job_name: kubernetes-cadvisor
        kubernetes_sd_configs:
          - role: node
        scheme: https
        metrics_path: /metrics/cadvisor
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)

      # ── Pods with prometheus.io/scrape=true annotation ───────────────────────
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: kubernetes_pod_name

      # ── Ofertonazos application metrics (explicit) ───────────────────────────
      - job_name: ofertonazos
        metrics_path: /api/metrics
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: [default]
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_label_app_kubernetes_io_name]
            action: keep
            regex: ofertonazos
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

  # ── Alerting rules ───────────────────────────────────────────────────────────
  ofertonazos-alerts.yml: |
    groups:
      - name: ofertonazos
        rules:
          - alert: OffertonazosDown
            expr: up{job="ofertonazos"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Ofertonazos is down"
              description: "No Ofertonazos pods have been reachable for more than 1 minute."

          - alert: OffertonazosHighMemory
            expr: process_resident_memory_bytes{job="ofertonazos"} > 400000000
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Ofertonazos high memory usage"
              description: "RSS memory exceeds 400 MB for 5 minutes."

          - alert: PodRestartingFrequently
            expr: rate(kube_pod_container_status_restarts_total{namespace="default"}[15m]) > 0
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Pod {{ $labels.pod }} restarting"
              description: "Pod has restarted more than once in the last 15 minutes."
